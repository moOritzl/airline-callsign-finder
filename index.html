<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Callsign Finder</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<h1>Airline Callsign Finder</h1>

<div id="auth-section">
    <div id="login-form">
        <input type="text" id="username" placeholder="Benutzername">
        <input type="password" id="password" placeholder="Passwort">
        <button id="login-btn">Login</button>
    </div>
    <div id="logout-section" class="hidden">
        Eingeloggt als <span id="current-user"></span>
        <button id="logout-btn">Logout</button>
    </div>
</div>

<input type="text" id="icao-input" placeholder="ICAO-Code eingeben (z. B. DLH)">
<ul id="suggestions"></ul>

<div id="crud-section" class="hidden">
    <h2>Airlines verwalten</h2>
    <form id="add-form">
        <input type="text" id="new-icao" placeholder="ICAO">
        <input type="text" id="new-callsign" placeholder="Callsign">
        <button type="submit">Hinzufügen</button>
    </form>
    <form id="edit-form" class="hidden">
        <input type="text" id="edit-icao" placeholder="ICAO" disabled>
        <input type="text" id="edit-callsign" placeholder="Callsign">
        <button type="submit">Speichern</button>
        <button type="button" id="cancel-edit">Abbrechen</button>
    </form>
    <ul id="airline-list"></ul>
    <div id="message"></div>
</div>

<script src="script.js"></script>
</body>
</html>
